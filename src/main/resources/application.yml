spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rallymate?serverTimezone=Asia/Seoul
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create        # 운영은 validate, 개발 중엔 update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: your-secret-key-here-must-be-at-least-32-characters
  access-expiration: 1800000    # 30분 (ms)
  refresh-expiration: 1209600000 # 14일 (ms)

sms:
  expiration: 300               # 인증 코드 유효 시간 (초)